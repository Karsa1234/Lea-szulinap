<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenék</title>
</head>
<style>
body{
        background-color: blue;
        color: white;
        font-family: Arial, Helvetica, sans-serif;
}
h1{
    text-align: center;
    padding: 5px;
}
.lejatszok {
    display: flex;
    justify-content: space-between;
}

.bal, .jobb {
    display: flex;
    flex-direction: column;
    gap: 20px;
}
h2{
    margin-top: 5px;
    margin-bottom: 5px;
}
</style>
<body>
    <h1>Zenék</h1>

<div class="lejatszok">
    <div class="bal">
        <h2>Missing Piece</h2>
        <audio controls>
            <source src="Zenék/John Michael Howell - Missing Piece (Lyrics).mp3" type="audio/mpeg">
        </audio>

        <h2>GÓLYÁK</h2>
        <audio controls>
            <source src="Zenék/GÓLYÁK - Magyar Banda.mp3" type="audio/mpeg">
        </audio>

        <h2>Beszívom</h2>
        <audio controls>
            <source src="Zenék/Beszívom - Follow The Flow.mp3" type="audio/mpeg">
        </audio>
    </div>

    <div class="jobb">
        <h2>Szülinap</h2>
        <audio controls>
            <source src="Zenék/Halász Judit Szülinap.mp3" type="audio/mpeg">
        </audio>

        <h2>Alma Együttes</h2>
        <audio controls>
            <source src="Zenék/Alma Együttes.mp3" type="audio/mpeg">
        </audio>

        <h2>Hupi Birthday</h2>
        <audio controls>
            <source src="Zenék/Hupi Birthday.mp3" type="audio/mpeg">
        </audio>
    </div>
</div>

</body>
</html>
